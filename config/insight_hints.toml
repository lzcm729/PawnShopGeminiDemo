# 洞察系统 - 底价暗示文案
# 维度1: ratio tier (Floor/Ask 比例档位)
# 维度2: disposition (客户性格倾向)
#
# ratio 档位:
#   veryLow  = Floor < 50% Ask  (极大空间)
#   low      = Floor 50-75% Ask (有空间)
#   medium   = Floor 75-90% Ask (接近)
#   high     = Floor > 90% Ask  (几乎没有)
#
# disposition:
#   desperate = 急切 (DESPERATE)
#   firm      = 坚定 (STUBBORN)
#   bluffing  = 虚张声势 (SUSPICIOUS/SAVVY)
#   sincere   = 诚恳 (NAIVE/SENTIMENTAL)

[veryLow]
desperate = "她急着出手，压价空间很大。"
firm = "空间不小，但他很固执，别指望他主动让步。"
bluffing = "他故作从容，但你可以试探底线。"
sincere = "他开价留了不少余地。"

[low]
desperate = "她有些余地，但已经很焦虑了。"
firm = "有一定空间，但他寸步不让的态度很明显。"
bluffing = "他在试探你的底线，别急着出手。"
sincere = "他有一定的谈判空间。"

[medium]
desperate = "她的底线已经快到了，别逼太紧。"
firm = "底线接近开口价，而且他不会退让。"
bluffing = "他装出没有余地的样子，但未必。"
sincere = "他的底线接近开口价。"

[high]
desperate = "她已经退无可退了。"
firm = "几乎没有让步余地，硬磨只会浪费时间。"
bluffing = "看起来没什么余地了。"
sincere = "他几乎没有让步余地。"
