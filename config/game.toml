dynamic_drop_rate_threshold = 10
# 连续未打经济卡轮数，触发情绪缓和
dynamic_drop_passive_rounds = 2

# --- 侮辱阈值 ---
# 当金低于期望价的此比例视为侮辱
insult_threshold = 0.70
# 侮辱耐心消耗
insult_patience_cost = 2

# --- 良心发现效果 ---
# 使用后本次议价经济卡效果减半系数
conscience_economic_penalty = 0.50
