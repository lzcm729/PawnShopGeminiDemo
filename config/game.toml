# ============================================================
# The Pawn's Dilemma - Game Configuration
# ============================================================
# 本文件包含所有游戏数值配置
# 策划可直接编辑此文件调整游戏平衡，无需修改代码
# ============================================================

# ------------------------------------------------------------
# 经济系统 (Economy)
# ------------------------------------------------------------
[economy]
# 游戏开始时的初始资金
initial_funds = 10000

# 终极目标：母亲手术费用（达成即胜利）
goal_amount = 100000

# 每周医药费（固定支出，未支付则 Game Over）
weekly_medical_cost = 1000

# 医药费缴纳周期（天数）
bill_cycle = 7

# 每日运营/生活成本（每日扣除）
daily_expenses = 50

# 店铺周租（当前禁用：游戏聚焦于医药费压力）
weekly_rent = 0

# 租金缴纳周期（天数）
rent_cycle = 7

# ------------------------------------------------------------
# 夜间玩法 (Night Phase)
# ------------------------------------------------------------
[night]
# 每晚基础精力点数
base_energy = 3

# 格物（研究物品）消耗的精力
insight_energy_cost = 1

# 默认知识池容量（设计目标：需多夜才能顿悟）
default_knowledge_capacity = 100

# 每次格物提取的知识量
insight_extraction_rate = 20

# 顿悟时额外奖励比例
epiphany_bonus_ratio = 0.2

# ------------------------------------------------------------
# 夜间鉴定参数 (Night Appraisal)
# ------------------------------------------------------------
# 格物时估价区间收窄比例（约 20%）
insight_range_shrink_rate = 0.20

# 格物时发现隐藏特征的概率（25%）
insight_trait_discovery_chance = 0.25

# 估价锁定阈值：当区间宽度/真值 < 此值时锁定（5%）
value_lock_threshold = 0.05

# ------------------------------------------------------------
# 母亲状态初始值 (Mother Status)
# ------------------------------------------------------------
[mother]
# 健康值（0-100）
health = 80

# 状态："Stable" | "Declining" | "Critical"
status = "Stable"

# 风险值（0-100，越高越危险）
risk = 10

# 护理等级："Basic" | "Standard" | "Premium"
care_level = "Basic"

# ------------------------------------------------------------
# 游戏玩法 (Gameplay)
# ------------------------------------------------------------
[gameplay]
# 每日行动点上限（用于鉴定等操作）
initial_action_points = 10

# 每日营业接待顾客数量上限
# 设计配比：1 叙事顾客 : 3 填充顾客
max_customers_per_day = 4

# ------------------------------------------------------------
# 声誉系统初始值 (Reputation)
# ------------------------------------------------------------
[reputation]
# 人情（高 = 慈善形象）
humanity = 50

# 商誉（高 = 可靠商人）
credibility = 50

# 清白（高 = 法律干净，做坏事会减少）
innocence = 50
