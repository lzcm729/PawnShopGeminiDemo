# ============================================================
# The Pawn's Dilemma - Game Configuration
# ============================================================
# 本文件包含所有游戏数值配置
# 策划可直接编辑此文件调整游戏平衡，无需修改代码
# ============================================================

# ------------------------------------------------------------
# 经济系统 (Economy)
# ------------------------------------------------------------
[economy]
# 游戏开始时的初始资金
initial_funds = 10000

# 终极目标：母亲手术费用（达成即胜利）
goal_amount = 500000

# 每周医药费（固定支出，未支付则 Game Over）
weekly_medical_cost = 1000

# 医药费缴纳周期（天数）
bill_cycle = 7

# 每日基础运营成本（每日扣除，设施维护费自动叠加）
daily_expenses = 0

# 店铺周租（当前禁用：游戏聚焦于医药费压力）
weekly_rent = 0

# 租金缴纳周期（天数）
rent_cycle = 7

# 清算价格比例（realValue * 此值）
liquidation_rate = 0.80
# 财务警告阈值
warning_threshold = 500
# 赔偿金倍率
compensation_multiplier = 2.0
# 回售溢价率
resale_premium = 1.1
# 变卖折扣率
sale_discount = 0.8
# 默认典当期限（天）
default_pawn_term_days = 7
# 续当延长天数
renewal_days = 7

# ------------------------------------------------------------
# 夜间玩法 (Night Phase)
# ------------------------------------------------------------
[night]
# 每晚基础精力点数
base_energy = 3

# 格物（研究物品）消耗的精力
insight_energy_cost = 1

# 默认知识池容量（设计目标：需多夜才能顿悟）
default_knowledge_capacity = 100

# 每次格物提取的知识量（随机范围）
insight_extraction_rate_min = 15
insight_extraction_rate_max = 25

# 顿悟时额外奖励比例（知识池上限的百分比）
epiphany_bonus_ratio = 0.25

# 格物意外事件概率
distraction_chance = 0.05
remarkable_find_chance = 0.05

# 窥见事件概率
glimpse_chance = 0.15

# 共鸣事件
resonance_chance = 0.10
resonance_bonus_ratio = 0.25

# 精力上限成长阶梯
energy_levels = [3, 4, 5]

# 顿悟后残留不确定性（5%区间）
epiphany_residual_uncertainty = 0.05

# ------------------------------------------------------------
# 夜间鉴定参数 (Night Appraisal)
# ------------------------------------------------------------
# 格物时估价区间收窄比例（约 20%）
insight_range_shrink_rate = 0.20

# 格物时发现隐藏特征的概率（25%）
insight_trait_discovery_chance = 0.25

# 估价锁定阈值：当区间宽度/真值 < 此值时锁定（5%）
value_lock_threshold = 0.05

# 格物等级系统 (Gewu Level System)
# 等级提取量范围
gewu_lv1_extraction_min = 15
gewu_lv1_extraction_max = 25
gewu_lv2_extraction_min = 18
gewu_lv2_extraction_max = 30
gewu_lv3_extraction_min = 22
gewu_lv3_extraction_max = 35
# 升级所需顿悟次数
gewu_lv2_epiphany_threshold = 3
gewu_lv3_epiphany_threshold = 8
# 等级对应精力上限
gewu_lv2_energy_max = 4
gewu_lv3_energy_max = 5

# ------------------------------------------------------------
# 典当业务系统 (Pawn Business)
# ------------------------------------------------------------
[pawn_business]
# 续当拒绝惩罚 (Renewal Refusal Penalties)
# 设计文档：固定值 Humanity -1, Credibility +1
renewal_refusal_penalty_0 = -1      # 固定人情惩罚
renewal_refusal_penalty_1 = -1      # 固定人情惩罚
renewal_refusal_penalty_2 = -1      # 固定人情惩罚
renewal_refusal_penalty_3_plus = -1 # 固定人情惩罚
# 续当拒绝时商誉奖励
renewal_refusal_credibility = 1     # 固定商誉奖励
# 续当接受声誉变化 (设计文档: 宽容加分但较小, 延期合同略微损害商誉)
renewal_accept_humanity = 1         # 续当接受 +1 人情
renewal_accept_credibility = -1     # 续当接受 -1 商誉

# ------------------------------------------------------------
# 母亲状态初始值 (Mother Status)
# ------------------------------------------------------------
[mother]
# 健康值（0-100）
health = 80

# 状态："Stable" | "Declining" | "Critical"
status = "Stable"

# 风险值（0-100，越高越危险）
risk = 10

# 护理等级："Basic" | "Standard" | "Premium"
care_level = "Basic"

# 不定时小额医疗支出（每天有概率触发）
random_medical_chance = 0.15    # 每天触发概率 15%
random_medical_min = 100        # 最小金额
random_medical_max = 300        # 最大金额

# 健康值每日变化
health_recovery_rate = 2        # 已支付状态每天恢复 +2%
health_decay_rate = 15          # 欠费状态每天衰减 -15%
emergency_treatment_cost = 200  # 紧急治疗费用
emergency_treatment_heal = 5    # 紧急治疗恢复量 +5%

# 健康状态阈值
health_stable_threshold = 70          # 健康>=此值为Stable
health_declining_threshold = 40       # 健康>=此值为Declining（<此值为Critical）
# 断缴影响
overdue_health_decay = 15             # 断缴时健康衰减
complication_health_loss = 10         # 并发症健康损失
overdue_risk_increase = 10            # 断缴时风险增加

# === P1-6: 主动护理选项 (Active Care Purchase) ===
care_standard_cost = 150              # 标准护理周费
care_premium_cost = 350               # 高级护理周费
care_duration = 7                     # 护理持续天数
care_standard_risk_reduction = 3      # 标准护理每日风险减少
care_premium_risk_reduction = 6       # 高级护理每日风险减少

# === H-1: 探望 → 次日心态 BUFF ===
morale_motivated_appraisal = 1.10     # 积极心态：鉴定精度提升10%
morale_motivated_negotiation = 0.90   # 积极心态：耐心消耗减少10%
morale_calm_appraisal = 1.05         # 平静心态：鉴定精度提升5%
morale_calm_negotiation = 0.95       # 平静心态：耐心消耗减少5%
morale_anxious_appraisal = 0.95      # 焦虑心态：鉴定精度降低5%
morale_anxious_negotiation = 1.05    # 焦虑心态：耐心消耗增加5%
morale_anxious_severe_appraisal = 0.90   # 严重焦虑：鉴定精度降低10%
morale_anxious_severe_negotiation = 1.10  # 严重焦虑：耐心消耗增加10%
morale_anxious_health_threshold = 30  # 严重焦虑的健康值阈值

# === H-3: 利率选择 → 母亲反应 ===
mother_proud_humanity_threshold = 70  # 母亲骄傲的人情阈值
mother_concern_humanity_threshold = 40 # 母亲担忧的人情阈值

# === H-4: 生命值 → 鉴定能力 ===
health_penalty_mild_threshold = 50    # 健康>=此值无惩罚
health_penalty_mild_modifier = 0.90   # 健康30-49：收敛速度×0.90
health_penalty_severe_threshold = 30  # 健康<此值严重惩罚
health_penalty_severe_modifier = 0.80 # 健康<30：收敛速度×0.80

# ------------------------------------------------------------
# 游戏玩法 (Gameplay)
# ------------------------------------------------------------
[gameplay]
# 每日行动点上限（用于鉴定等操作）
initial_action_points = 10

# 每日营业接待顾客数量上限
# 设计配比：1 叙事顾客 : 3 填充顾客
max_customers_per_day = 4

# 每日挑战概率
daily_challenge_probability = 0.80
# 挑战利润目标
challenge_profit_target = 500
# 基础库存容量
base_inventory_capacity = 5

# ------------------------------------------------------------
# 声誉系统初始值 (Reputation)
# ------------------------------------------------------------
[reputation]
# 人情（高 = 慈善形象）
humanity = 50

# 商誉（高 = 可靠商人）
credibility = 50

# 清白（高 = 法律干净，做坏事会减少）
innocence = 50

# ------------------------------------------------------------
# 鉴定意外事件 (Appraisal Events) — d100 单骰互斥
# ------------------------------------------------------------
[appraisal_events]
# 灵光一闪：骰子 1-10
breakthrough_max = 10
breakthrough_uncertainty_multiplier = 0.60
breakthrough_range_shrink = 0.30

# 鉴定失误：骰子 11-15
mishap_max = 15
mishap_uncertainty_increase = 0.05

# 客户不耐烦：骰子 16-25
impatient_max = 25

# 意外发现：骰子 26-30
lucky_find_max = 30

# 31-100 无事件

# FAKE 保底机制
fake_pity_multiplier_2 = 1.5   # 第2次鉴定概率倍率
fake_pity_multiplier_3 = 2.0   # 第3次鉴定概率倍率
fake_pity_guaranteed = 4        # 第N次强制发现

# ------------------------------------------------------------
# 鉴定系统参数 (Appraisal)
# ------------------------------------------------------------
[appraisal]
# 基础发现概率
base_discovery_chance = 0.5
# 难度系数
discovery_difficulty_factor = 0.3
# 正常收窄率
normal_shrink_rate = 0.85
# 正常收敛速度
normal_convergence_speed = 0.15
# 特征发现后不确定性
trait_discovery_uncertainty = 0.10
# 失误范围扩张
mishap_range_expansion = 0.05
# 估价非对称偏斜最小值
skew_min = 0.2
# 估价非对称偏斜范围
skew_range = 0.6

# --- 鉴定精度收益参数 (Appraisal Precision Payoff) ---
# uncertainty 有效范围: [precision_u_min, precision_u_max]
precision_u_min = 0.05
precision_u_max = 0.30
# 方向 A1: NPC 开价修正系数 [最优, 最差]
precision_ask_best = 0.92
precision_ask_worst = 1.08
# 方向 A2: 侮辱阈值修正系数 [最优, 最差]
precision_insult_best = 0.85
precision_insult_worst = 1.10
# 方向 D: 推拉让步幅度乘数 [最优, 最差]
precision_concession_best = 1.30
precision_concession_worst = 0.70
# 方向 C': 黑市出售波动偏移 [最优下限, 最优上限, 最差下限, 最差上限]
precision_bm_offset_low_best = -0.02
precision_bm_offset_high_best = 0.02
precision_bm_offset_low_worst = -0.30
precision_bm_offset_high_worst = 0.10
# 方向 C': 黑市收购精度修正 [最优, 最差]
precision_bm_purchase_best = 1.00
precision_bm_purchase_worst = 0.85

# ------------------------------------------------------------
# 声誉增减表 (Reputation Deltas)
# ------------------------------------------------------------
[reputation_deltas]
# 慈善档(0%)
charity_generous_humanity = 2         # 大额慈善 +人情
charity_normal_humanity = 1           # 普通慈善 +人情
# 援助档(5%)
aid_credibility = 1                   # 援助 +商誉
aid_generous_humanity = 1             # 大额援助 +人情
# 标准档(10%)
standard_credibility = 1              # 标准 +商誉
# 高利贷档(20%)
shark_humanity = -3                   # 高利贷 -人情
shark_credibility = -2                # 高利贷 -商誉
shark_innocence = -2                  # 高利贷 -清白
# 赃物相关
stolen_known_leverage_innocence = -3  # 已知赃物+压价 -清白
stolen_known_no_leverage_innocence = -2 # 已知赃物未压价 -清白
# 违禁品
contraband_innocence = -3             # 违禁品 -清白
contraband_credibility = -2           # 违禁品 -商誉
# 严打
crackdown_credibility = -20           # 严打 -商誉
crackdown_innocence = -5              # 严打 -清白
# 赝品
fake_credibility = -5                 # 赝品 -商誉
# 赎回/赔偿
redemption_success_credibility = 1    # 赎回成功 +商誉 (#59: 设计文档为 +1)
charity_return_humanity = 15          # 慈善归还 +人情
compensation_humanity = -15           # 赔偿 -人情
compensation_credibility = -10        # 赔偿 -商誉
compensation_innocence = -5           # 赔偿 -清白
# 高级交易
premium_threshold = 2000              # 高级交易金额阈值
premium_value_ratio = 1.5             # 高级交易价值比

# ------------------------------------------------------------
# 议价系统 (Negotiation)
# ------------------------------------------------------------
[negotiation]
# 基础侮辱阈值
base_insult_threshold = 0.70
# 侮辱阈值下限
insult_clamp_min = 0.50
# 侮辱阈值上限
insult_clamp_max = 0.90
# 首次报价修正系数
first_offer_multiplier = 0.3
# 坚持报价修正系数
persist_multiplier = 0.5
# 每次坚持的额外加成
persist_bonus_per_count = 0.10
# 坚持加成上限
persist_bonus_cap = 0.30

# 行为侮辱修正
[negotiation.behavior_insult_modifiers]
DESPERATE = -0.10
STUBBORN = 0.0
SUSPICIOUS = 0.10
NAIVE = -0.05
SAVVY = 0.05
SENTIMENTAL = 0.05

# 行为底价修正（乘性：NPC底价 × (1 + sum(modifiers))，clamp [0.70, 1.20]）
[negotiation.behavior_floor_modifiers]
DESPERATE = -0.15
NAIVE = -0.10
SAVVY = 0.10
SUSPICIOUS = 0.05
STUBBORN = 0.0
SENTIMENTAL = 0.0

# 行为耐心修正（加性：patience += sum(modifiers)，clamp [1, 5]）
[negotiation.behavior_patience_modifiers]
DESPERATE = -1
STUBBORN = 1
SUSPICIOUS = -1
SENTIMENTAL = 1
NAIVE = 0
SAVVY = 0

# 声誉影响议价 (Reputation Modifiers)
[negotiation.reputation_modifiers]
# 人情 > 60 时：NPC 让步概率加成
humanity_60_concession_bonus = 0.10
# 人情 > 70 时：NPC 让步概率加成（覆盖上面的值）
humanity_70_concession_bonus = 0.15
# 商誉 > 60 时：NPC 耐心消耗概率减少
credibility_60_patience_reduction = 0.05

# 推拉策略：温和
[negotiation.push_pull.SOFT]
base_concession_chance = 0.50
concession_ratio = 0.15
max_concessions = 3
base_patience_loss_chance = 0.45

# 推拉策略：强硬
[negotiation.push_pull.HARD]
base_concession_chance = 0.15
concession_ratio = 0.10
max_concessions = 1
base_patience_loss_chance = 0.75

# 推拉策略：狡猾
[negotiation.push_pull.SLY]
base_concession_chance = 0.30
concession_ratio = 0.10
max_concessions = 2
base_patience_loss_chance = 0.65

# 推拉策略：沉稳
[negotiation.push_pull.CALM]
base_concession_chance = 0.25
concession_ratio = 0.10
max_concessions = 2
base_patience_loss_chance = 0.60

# 回合上限（防止拖沓）
max_rounds = 5

# 侮辱惩罚：侮辱不固定扣耐心，而是增加 push-pull 耐心流失概率
insult_patience_loss_bonus = 0.25

# Mercy 机制：耐心低时给予让步概率加成
mercy_threshold = 2
mercy_concession_bonus = 0.20

# 近底线加成：出价接近底价时增加让步概率
near_floor_ratio = 0.90
near_floor_concession_bonus = 0.20

# 攻心让步概率加成
heart_strike_concession_bonus = 0.30

# ------------------------------------------------------------
# 黑市系统 (Black Market)
# ------------------------------------------------------------
[blackmarket]
# 需求惯性加成
demand_inertia_bonus = 0.30
# 购买价格最低倍率
purchase_price_min = 1.10
# 购买价格随机范围
purchase_price_range = 0.30
# 出售最低倍率基础
sale_multiplier_min_base = 0.60
# 出售最低倍率范围
sale_multiplier_min_range = 0.10
# 出售最高倍率基础
sale_multiplier_max_base = 0.75
# 出售最高倍率范围
sale_multiplier_max_range = 0.10
# 搜查罚款基础
search_penalty_base = 300
# 搜查罚款范围
search_penalty_range = 200
# 搜查锁定天数
search_lock_days = 3
# 调查锁定天数
investigation_lock_days = 7
# 调查声誉损失
investigation_rep_loss = 10
# 保护费触发清白阈值
protection_fee_innocence_threshold = 40
# 保护费增长率
protection_fee_growth_rate = 0.15
# 保护费请求间隔（天）
protection_fee_request_interval = 5
# 拒绝冷却（天）
protection_fee_refusal_cooldown = 2
# 每次拒绝风险增加
refusal_risk_per_time = 0.10
# 拒绝风险上限
refusal_risk_cap = 0.30
# 低热度安全天数
low_heat_safe_days = 3
# 低热度价格加成
low_heat_price_bonus = 0.05
# 卧底出售惩罚
undercover_sale_penalty = 0.05

# --- 客户生态转变 (P1-10: Customer Ecology Shift) ---
# 清白阈值：低于此值开始吸引灰色客户
ecology_threshold = 60
# 轻度转变增加灰色客户比例 (清白 41-60)
ecology_shift_mild = 0.10
# 中度转变增加灰色客户比例 (清白 21-40)
ecology_shift_moderate = 0.25
# 重度转变增加灰色客户比例 (清白 0-20)
ecology_shift_severe = 0.40
# 轻度转变清白上限
ecology_mild_max_innocence = 60
# 中度转变清白上限
ecology_moderate_max_innocence = 40
# 重度转变清白上限
ecology_severe_max_innocence = 20

# ------------------------------------------------------------
# 角色能力系统 (Ability)
# ------------------------------------------------------------
[ability]
# 全局底价压缩上限
global_floor_reduction_cap = 0.20
# 施压基础压缩量
pressure_base_reduction = 0.08
# 攻心-绝望压缩量
heart_strike_desperate = 0.12
# 攻心-强硬压缩量
heart_strike_hard = 0.06
# 攻心-默认压缩量
heart_strike_default = 0.10
# 明察秋毫-每缺陷压缩量
sharp_scrutiny_per_flaw = 0.03
# 时机加成倍率
timing_bonus_multiplier = 1.20
# 口碑基础概率
wom_base_chance = 0.25
# 口碑增长步长
wom_increment = 0.15
# 口碑保底连续次数
wom_guarantee_streak = 5
# 远见-疲劳值阈值
foresight_fatigue_threshold = 10
# 远见-希望值阈值
foresight_hope_threshold = 10

# 道德回响
[ability.moral_echo]
low_threshold = 50                    # 低severity阈值
medium_threshold = 30                 # 中severity阈值

# 镜像法则
[ability.mirror_law]
level1_threshold = 40                 # 一级警告清白阈值
level2_threshold = 35                 # 二级警告清白阈值
level3_threshold = 30                 # 三级警告清白阈值
cooldown_days = 2                     # 警告冷却天数

# ------------------------------------------------------------
# NPC 填充参数 (NPC Filler)
# ------------------------------------------------------------
[npc.filler]
# 期望价比例
desired_ratio = 0.70
# 底价比例
minimum_ratio = 0.50
# 侮辱阈值比例
insult_ratio = 0.70
# 基础耐心
base_patience = 3
# 稀有遭遇概率
rare_encounter_chance = 0.075

# --- 后果回传：客户质量偏移 (H-2: Moral Actions → Customer Pool Quality) ---
# 人情加成系数（每10点人情增加可信客户权重）
humanity_quality_bonus_per_10 = 0.05
# 清白惩罚系数（每10点清白低于50增加风险客户权重）
low_innocence_risk_per_10 = 0.08
# 可信客户修正：赎回意愿提升
trustworthy_redeem_bonus = 0.10
# 可信客户修正：耐心加成
trustworthy_patience_bonus = 1
# 风险客户修正：赎回意愿降低
risky_redeem_penalty = -0.15
# 风险客户修正：耐心惩罚
risky_patience_penalty = -1
# 风险客户被标记为赃物的概率
risky_stolen_chance = 0.12
# 偏移最大值（防止极端偏向）
quality_bias_cap = 0.30

# ------------------------------------------------------------
# 新闻系统 (News)
# ------------------------------------------------------------
[news]
# 最大新闻显示位
max_display_slots = 3
# 最大叙事新闻位
max_narrative_slots = 2
# 违规检测最低概率
violation_detection_min = 0.60
# 违规检测随机范围
violation_detection_range = 0.20

# ------------------------------------------------------------
# 叙事参数 (Narrative)
# ------------------------------------------------------------
[narrative]
# 赎回希望阈值
redeem_hope_threshold = 40
# 续当希望阈值
renew_hope_threshold = 30
# 希望崩塌阈值
hope_collapse_threshold = 15

# ------------------------------------------------------------
# 预约系统 (Appointment)
# ------------------------------------------------------------
[appointment]
# 神秘访客概率
mystery_visitor_chance = 0.15

# ------------------------------------------------------------
# 库存自然老化 (Inventory Decay)
# 物品在库期间，按天数里程碑自动追加状态日志（纯叙事，不影响价值）
# ------------------------------------------------------------
[inventory_decay]
# 触发日志的存储天数阈值
thresholds = [7, 14, 21, 28]

# ------------------------------------------------------------
# 库存溢出伤害 (Inventory Overflow Damage)
# 库存超过容量上限时，每件超额物品有概率受损
# ------------------------------------------------------------
[inventory_overflow]
# 每件超额物品受损概率（每晚）
damage_chance = 0.30
# 超额多少件以上会丢失物品（而非仅受损）
loss_threshold = 3
# 超过 loss_threshold 后每件额外物品丢失概率
loss_chance = 0.10

# ------------------------------------------------------------
# 洞察参数 (Insight)
# ------------------------------------------------------------
[insight]
# 洞察AP消耗
ap_cost = 1
# 基础效率
base_efficiency = 0.05
# 每层加成
layer_bonus = 0.10
# 最大效率
max_efficiency = 0.25
# 慷慨判定阈值
generous_threshold = 0.9
# 公平判定阈值
fair_threshold = 0.7
# 准确度高阈值
accuracy_high_threshold = 1.2
# 准确度低阈值
accuracy_low_threshold = 1.8

# ------------------------------------------------------------
# 工作台系统 (Workshop)
# ------------------------------------------------------------
[workshop]
# 动态成本调整参数
# 额外 G1 负面标签的成本加成比例（每个额外标签 +20%）
extra_negative_tag_cost_ratio = 0.20
# 高价值物品阈值（realValue > 此值时触发成本加成）
high_value_threshold = 5000
# 高价值物品成本加成比例
high_value_cost_ratio = 0.30
# 已部分修复时的成本减免比例（对应修复成本减半）
partial_restore_discount = 0.50
# 违约赔偿金倍率（principal × 此值）
breach_compensation_multiplier = 2.0
# 违约声誉损失
breach_humanity_loss = -15
breach_credibility_loss = -10
breach_innocence_loss = -5

# Forgery / Counterfeit parameters
[workshop.forgery]
base_detection_rate = 0.15          # 基础鉴伪概率 15%
detection_increment = 0.03          # 每次伪造出售 +3%
detection_cap = 0.33                # 鉴伪概率上限 33%
detected_price_penalty = 0.50       # 被识破后售价系数（原价x0.50）
detected_heat_increase = 3          # 被识破后热度增加
detected_credibility_loss = -3      # 被识破后商誉损失
innocence_cost_active = -3          # 伪造当期物品清白成本
innocence_cost_sale = -4            # 出售伪造品清白成本

