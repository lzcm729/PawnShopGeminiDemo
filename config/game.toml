# ============================================================
# The Pawn's Dilemma - Game Configuration
# ============================================================
# 本文件包含所有游戏数值配置
# 策划可直接编辑此文件调整游戏平衡，无需修改代码
# ============================================================

# ------------------------------------------------------------
# 经济系统 (Economy)
# ------------------------------------------------------------
[economy]
# 游戏开始时的初始资金
initial_funds = 10000

# 终极目标：母亲手术费用（达成即胜利）
goal_amount = 50000

# 每周医药费（固定支出，未支付则 Game Over）
weekly_medical_cost = 1000

# 医药费缴纳周期（天数）
bill_cycle = 7

# 每日基础运营成本（每日扣除，设施维护费自动叠加）
daily_expenses = 50

# 店铺周租（当前禁用：游戏聚焦于医药费压力）
weekly_rent = 0

# 租金缴纳周期（天数）
rent_cycle = 7

# 清算价格比例（realValue * 此值）
liquidation_rate = 0.80
# 财务警告阈值
warning_threshold = 500
# 赔偿金倍率
compensation_multiplier = 2.0
# 回售溢价率
resale_premium = 1.1
# 变卖折扣率
sale_discount = 0.8
# 默认典当期限（天）
default_pawn_term_days = 7
# 续当延长天数
renewal_days = 7

# ------------------------------------------------------------
# 夜间玩法 (Night Phase)
# ------------------------------------------------------------
[night]
# 每晚基础精力点数
base_energy = 3

# 格物（研究物品）消耗的精力
insight_energy_cost = 1

# 默认知识池容量（设计目标：需多夜才能顿悟）
default_knowledge_capacity = 100

# 每次格物提取的知识量（随机范围）
insight_extraction_rate_min = 15
insight_extraction_rate_max = 25

# 顿悟时额外奖励比例（知识池上限的百分比）
epiphany_bonus_ratio = 0.25

# 格物意外事件概率
distraction_chance = 0.05
remarkable_find_chance = 0.05

# 窥见事件概率
glimpse_chance = 0.15

# 共鸣事件
resonance_chance = 0.10
resonance_bonus_ratio = 0.25

# 精力上限成长阶梯
energy_levels = [3, 4, 5]

# 顿悟后残留不确定性（5%区间）
epiphany_residual_uncertainty = 0.05

# 顿悟仪式时长缩放 (Epiphany Duration Scaling)
# 基于格物等级（层深）缩放顿悟仪式展示时长
# 格物等级1/2/3 对应的时长乘数
epiphany_duration_lv1 = 1.0          # Lv1: 基础时长 (3s)
epiphany_duration_lv2 = 1.5          # Lv2: 1.5倍 (4.5s)
epiphany_duration_lv3 = 2.0          # Lv3: 2倍 (6s)
# 基础顿悟时长（毫秒）
epiphany_base_duration_ms = 3000

# ------------------------------------------------------------
# 夜间鉴定参数 (Night Appraisal)
# ------------------------------------------------------------
# 格物时估价区间收窄比例（约 20%）
insight_range_shrink_rate = 0.20

# 格物时发现隐藏特征的概率（25%）
insight_trait_discovery_chance = 0.25

# 估价锁定阈值：当区间宽度/真值 < 此值时锁定（5%）
value_lock_threshold = 0.05

# 格物等级系统 (Gewu Level System)
# 等级提取量范围
gewu_lv1_extraction_min = 15
gewu_lv1_extraction_max = 25
gewu_lv2_extraction_min = 18
gewu_lv2_extraction_max = 30
gewu_lv3_extraction_min = 22
gewu_lv3_extraction_max = 35
# 升级所需顿悟次数
gewu_lv2_epiphany_threshold = 3
gewu_lv3_epiphany_threshold = 8
# 等级对应精力上限
gewu_lv2_energy_max = 4
gewu_lv3_energy_max = 5

# ------------------------------------------------------------
# 典当业务系统 (Pawn Business)
# ------------------------------------------------------------
[pawn_business]
# 续当拒绝惩罚 (Renewal Refusal Penalties)
# 按续约次数递增: -10/-15/-20/-25
renewal_refusal_penalty_0 = -10     # 第1次拒绝 人情-10
renewal_refusal_penalty_1 = -15     # 第2次拒绝 人情-15
renewal_refusal_penalty_2 = -20     # 第3次拒绝 人情-20
renewal_refusal_penalty_3_plus = -25 # 第4次及以上拒绝 人情-25
# 续当拒绝时商誉奖励
renewal_refusal_credibility = 1     # 固定商誉奖励
# 续当接受声誉变化 (设计文档: +5 人情)
renewal_accept_humanity = 5         # 续当接受 +5 人情
renewal_accept_credibility = 0      # 续当接受不影响商誉
# 拒绝取消典当的声誉惩罚 (#23: 客户请求取消但被拒)
refuse_cancel_humanity = -5         # 拒绝取消 -5 人情

# ------------------------------------------------------------
# 母亲状态初始值 (Mother Status)
# ------------------------------------------------------------
[mother]
# 健康值（0-100）
health = 80

# 状态："Stable" | "Declining" | "Critical"
status = "Stable"

# 风险值（0-100，越高越危险）
risk = 10

# 护理等级："Basic" | "Standard" | "Premium"
care_level = "Basic"

# 不定时小额医疗支出（每天有概率触发）
random_medical_chance = 0.15    # 每天触发概率 15%
random_medical_min = 100        # 最小金额
random_medical_max = 300        # 最大金额

# 健康值每日变化
health_recovery_rate = 2        # 已支付状态每天恢复 +2%
health_decay_rate = 15          # 欠费状态每天衰减 -15%
emergency_treatment_cost = 200  # 紧急治疗费用
emergency_treatment_heal = 5    # 紧急治疗恢复量 +5%

# 健康状态阈值
health_stable_threshold = 70          # 健康>=此值为Stable
health_declining_threshold = 40       # 健康>=此值为Declining（<此值为Critical）
# 断缴影响
overdue_health_decay = 15             # 断缴时健康衰减
complication_health_loss = 10         # 并发症健康损失
overdue_risk_increase = 10            # 断缴时风险增加

# === P1-6: 主动护理选项 (Active Care Purchase) ===
care_standard_cost = 150              # 标准护理周费
care_premium_cost = 350               # 高级护理周费
care_duration = 7                     # 护理持续天数
care_standard_risk_reduction = 3      # 标准护理每日风险减少
care_premium_risk_reduction = 6       # 高级护理每日风险减少

# === H-1: 探望 → 次日心态 BUFF ===
morale_motivated_appraisal = 1.10     # 积极心态：鉴定精度提升10%
morale_motivated_negotiation = 0.90   # 积极心态：耐心消耗减少10%
morale_calm_appraisal = 1.05         # 平静心态：鉴定精度提升5%
morale_calm_negotiation = 0.95       # 平静心态：耐心消耗减少5%
morale_anxious_appraisal = 0.95      # 焦虑心态：鉴定精度降低5%
morale_anxious_negotiation = 1.05    # 焦虑心态：耐心消耗增加5%
morale_anxious_severe_appraisal = 0.90   # 严重焦虑：鉴定精度降低10%
morale_anxious_severe_negotiation = 1.10  # 严重焦虑：耐心消耗增加10%
morale_anxious_health_threshold = 30  # 严重焦虑的健康值阈值

# === H-3: 利率选择 → 母亲反应 ===
mother_proud_humanity_threshold = 70  # 母亲骄傲的人情阈值
mother_concern_humanity_threshold = 40 # 母亲担忧的人情阈值

# === H-4: 生命值 → 鉴定能力 ===
health_penalty_mild_threshold = 50    # 健康>=此值无惩罚
health_penalty_mild_modifier = 0.90   # 健康30-49：收敛速度×0.90
health_penalty_severe_threshold = 30  # 健康<此值严重惩罚
health_penalty_severe_modifier = 0.80 # 健康<30：收敛速度×0.80

# ------------------------------------------------------------
# 游戏玩法 (Gameplay)
# ------------------------------------------------------------
[gameplay]
# 每日行动点上限（用于鉴定等操作）
initial_action_points = 10

# 每日营业接待顾客数量上限
# 设计配比：1 叙事顾客 : 3 填充顾客
max_customers_per_day = 4

# 每日挑战概率
daily_challenge_probability = 0.80
# 挑战利润目标
challenge_profit_target = 500
# 基础库存容量
base_inventory_capacity = 5

# ------------------------------------------------------------
# 声誉系统初始值 (Reputation)
# ------------------------------------------------------------
[reputation]
# 人情（高 = 慈善形象）
humanity = 50

# 商誉（高 = 可靠商人）
credibility = 50

# 清白（高 = 法律干净，做坏事会减少）
innocence = 50

# --- 行业排斥警告 (#33) ---
credibility_exclusion_threshold = 15  # 商誉低于此值触发行业排斥警告邮件

# --- 暗路代价：谨慎客户 (#48) ---
# innocence < 阈值时，按概率生成更难对付的客户
cautious_customer_thresholds = [45, 40, 35, 30]
cautious_customer_chances = [0.0, 0.15, 0.25, 0.40]

# --- 暗路代价：客户减少 (#49) ---
dark_path_customer_reduction_threshold = 30  # innocence < 此值时每日客户 -1

# --- 暗路代价：执法事件 (#50) ---
dark_path_enforcement_threshold = 15         # innocence < 此值时可能触发执法事件
dark_path_enforcement_chance = 0.20          # 每日触发执法搜查概率
dark_path_enforcement_fine_base = 500        # 执法搜查基础罚款
dark_path_enforcement_fine_range = 300       # 执法搜查罚款随机范围
dark_path_enforcement_credibility = -5       # 执法搜查商誉损失
dark_path_enforcement_innocence = -3         # 执法搜查清白损失

# ------------------------------------------------------------
# 鉴定意外事件 (Appraisal Events) — d100 单骰互斥
# ------------------------------------------------------------
[appraisal_events]
# 灵光一闪：骰子 1-10
breakthrough_max = 10
breakthrough_uncertainty_multiplier = 0.60
breakthrough_range_shrink = 0.30

# 鉴定失误：骰子 11-15
mishap_max = 15
mishap_uncertainty_increase = 0.05

# 客户不耐烦：骰子 16-25
impatient_max = 25

# 意外发现：骰子 26-30
lucky_find_max = 30

# 31-100 无事件

# FAKE 保底机制
fake_pity_multiplier_2 = 1.5   # 第2次鉴定概率倍率
fake_pity_multiplier_3 = 2.0   # 第3次鉴定概率倍率
fake_pity_guaranteed = 4        # 第N次强制发现

# ------------------------------------------------------------
# 鉴定系统参数 (Appraisal)
# ------------------------------------------------------------
[appraisal]
# 基础发现概率
base_discovery_chance = 0.5
# 难度系数
discovery_difficulty_factor = 0.3
# 正常收窄率
normal_shrink_rate = 0.85
# 正常收敛速度
normal_convergence_speed = 0.15
# 特征发现后不确定性
trait_discovery_uncertainty = 0.10
# 失误范围扩张
mishap_range_expansion = 0.05
# 鉴定收益天花板：uncertainty <= 此值时显示"已看透"提示
appraisal_mastery_threshold = 0.12
# 估价非对称偏斜最小值
skew_min = 0.2
# 估价非对称偏斜范围
skew_range = 0.6

# --- 鉴定精度收益参数 (Appraisal Precision Payoff) ---
# uncertainty 有效范围: [precision_u_min, precision_u_max]
precision_u_min = 0.05
precision_u_max = 0.30
# 方向 A1: NPC 开价修正系数 [最优, 最差]
precision_ask_best = 0.92
precision_ask_worst = 1.08
# 方向 A2: 侮辱阈值修正系数 [最优, 最差]
precision_insult_best = 0.85
precision_insult_worst = 1.10
# 方向 D: 推拉让步幅度乘数 [最优, 最差]
precision_concession_best = 1.30
precision_concession_worst = 0.70
# 方向 C': 黑市出售波动偏移 [最优下限, 最优上限, 最差下限, 最差上限]
precision_bm_offset_low_best = -0.02
precision_bm_offset_high_best = 0.02
precision_bm_offset_low_worst = -0.30
precision_bm_offset_high_worst = 0.10
# 方向 C': 黑市收购精度修正 [最优, 最差]
precision_bm_purchase_best = 1.00
precision_bm_purchase_worst = 0.85

# ------------------------------------------------------------
# 声誉增减表 (Reputation Deltas)
# 六区间利率声誉映射（卡牌议价系统）
# ------------------------------------------------------------
[reputation_deltas]
# CHARITY 恩惠档(0%) — 主动善良 +2 / 被动善良 +1（当前统一为 +2，后续卡牌系统区分）
charity_humanity = 2                  # 恩惠 +2 人情
charity_credibility = 0               # 恩惠 无商誉变化
charity_innocence = 0                 # 恩惠 无清白变化
# AID 公道档(1%-4%) — 慷慨时 +1 人情，普通 0；商誉 +1
aid_humanity_generous = 1             # 公道+慷慨 +1 人情
aid_humanity_normal = 0               # 公道 无人情变化
aid_credibility = 1                   # 公道 +1 商誉
aid_innocence = 0                     # 公道 无清白变化
# STANDARD 精明档(5%-9%) — 商誉 +1
standard_humanity = 0                 # 精明 无人情变化
standard_credibility = 1              # 精明 +1 商誉
standard_innocence = 0                # 精明 无清白变化
# ELEVATED 偏高档(10%-14%) — 商誉 +1
elevated_humanity = 0                 # 偏高 无人情变化
elevated_credibility = 1              # 偏高 +1 商誉
elevated_innocence = 0                # 偏高 无清白变化
# HIGH 贪婪档(15%-19%) — 人情 -1，清白 -1
high_humanity = -1                    # 贪婪 -1 人情
high_credibility = 0                  # 贪婪 无商誉变化
high_innocence = -1                   # 贪婪 -1 清白
# SHARK 掠夺档(20%+) — 人情 -3，商誉 -2，清白 -2
shark_humanity = -3                   # 掠夺 -3 人情
shark_credibility = -2                # 掠夺 -2 商誉
shark_innocence = -2                  # 掠夺 -2 清白
# 赃物相关
stolen_known_leverage_innocence = -3  # 已知赃物+压价 -清白
stolen_known_no_leverage_innocence = -2 # 已知赃物未压价 -清白
# 违禁品
contraband_innocence = -3             # 违禁品 -清白
contraband_credibility = -2           # 违禁品 -商誉
# 严打
crackdown_credibility = -20           # 严打 -商誉
crackdown_innocence = -5              # 严打 -清白
# 赝品
fake_credibility = -5                 # 赝品 -商誉
# 赎回/赔偿
redemption_success_credibility = 2    # 赎回成功 +商誉 (#63: 设计文档为 +2)
charity_return_humanity = 15          # 慈善归还 +人情
compensation_humanity = -15           # 赔偿 -人情
compensation_credibility = -10        # 赔偿 -商誉
compensation_innocence = -5           # 赔偿 -清白
# 高级交易
premium_threshold = 2000              # 高级交易金额阈值
premium_value_ratio = 1.5             # 高级交易价值比

# ------------------------------------------------------------
# 议价系统 (Negotiation)
# ------------------------------------------------------------
[negotiation]
# 基础侮辱阈值
base_insult_threshold = 0.70
# 侮辱阈值下限
insult_clamp_min = 0.50
# 侮辱阈值上限
insult_clamp_max = 0.90
# 首次报价修正系数
first_offer_multiplier = 0.3
# 坚持报价修正系数
persist_multiplier = 0.5
# 每次坚持的额外加成
persist_bonus_per_count = 0.10
# 坚持加成上限
persist_bonus_cap = 0.30

# 侮辱惩罚：侮辱不固定扣耐心，而是增加 push-pull 耐心流失概率
insult_patience_loss_bonus = 0.25

# Mercy 机制：耐心低时给予让步概率加成
mercy_threshold = 2
mercy_concession_bonus = 0.20

# 近底线加成：出价接近底价时增加让步概率
near_floor_ratio = 0.90
near_floor_concession_bonus = 0.20

# 攻心让步概率加成
heart_strike_concession_bonus = 0.30

# 耐心预警阈值（耐心低于最大值的此比例时进入 caution 区）
patience_caution_threshold = 0.6
# 耐心预警阈值（耐心低于最大值的此比例时进入 danger 区）
patience_danger_threshold = 0.3
# 耐心归零时触发最后通牒的概率
ultimatum_chance = 0.5

# --- 耐心消耗规则 (E-4) ---
# 被动消耗：每回合自然流逝
passive_decay_per_round = 0          # 0 = 被动消耗禁用（当前通过push-pull概率消耗）
# 拒绝客户塞牌的耐心消耗
refuse_card_cost = 1
# 耐心=1 特殊决策窗口：最后让步利率调整量
last_chance_rate_adjustment = 0.01
# 耐心=0 最终修正：当金可调整比例
final_adjustment_principal_ratio = 0.05
# 耐心=0 最终修正：利率可调整量
final_adjustment_rate_step = 0.01

# 近Ask耐心减免：出价接近NPC Ask价格时减少耐心消耗概率 (#41)
near_ask_ratio = 0.90                     # offer >= ask * 此值 视为"接近Ask"
near_ask_patience_reduction = 0.20        # 耐心消耗概率 -20%

# SLY风格虚高Ask倍率 (#46)：狡猾型NPC初始Ask虚高
sly_ask_inflation = 0.20                  # Ask价格 +20%

# 商誉→高端客户阈值 (#32)
credibility_high_end_threshold = 60       # 商誉高于此值时吸引高价值客户
credibility_high_end_value_boost = 0.25   # 高价值物品出现概率提升25%

# 行为侮辱修正
[negotiation.behavior_insult_modifiers]
DESPERATE = -0.10
STUBBORN = 0.0
SUSPICIOUS = 0.10
NAIVE = -0.05
SAVVY = 0.05
SENTIMENTAL = 0.05

# 行为底价修正（乘性：NPC底价 × (1 + sum(modifiers))，clamp [0.70, 1.20]）
[negotiation.behavior_floor_modifiers]
DESPERATE = -0.15
NAIVE = -0.10
SAVVY = 0.10
SUSPICIOUS = 0.05
STUBBORN = 0.0
SENTIMENTAL = 0.0

# 行为耐心修正（加性：patience += sum(modifiers)，clamp [1, 5]）
[negotiation.behavior_patience_modifiers]
DESPERATE = -1
STUBBORN = 1
SUSPICIOUS = -1
SENTIMENTAL = 1
NAIVE = 0
SAVVY = 0

# 行为期望价修正（加性：desired_ratio += sum(modifiers)，clamp [0.50, 1.20]）
[negotiation.behavior_desired_modifiers]
DESPERATE = -0.15    # 走投无路，愿意低价 → 0.55
STUBBORN = 0.25      # 舍不得，要高价 → 0.95
SAVVY = 0.15         # 识货，知道值多少 → 0.85
SUSPICIOUS = 0.30    # 虚报试探 → 1.00
SENTIMENTAL = 0.20   # 情感附加值 → 0.90
NAIVE = 0.0          # 不太懂行，按默认

# 声誉影响议价 (Reputation Modifiers)
[negotiation.reputation_modifiers]
# 人情 > 60 时：NPC 让步概率加成
humanity_60_concession_bonus = 0.10
# 人情 > 70 时：NPC 让步概率加成（覆盖上面的值）
humanity_70_concession_bonus = 0.15
# 商誉 > 60 时：NPC 耐心消耗概率减少
credibility_60_patience_reduction = 0.05

# 推拉策略：温和
[negotiation.push_pull.SOFT]
base_concession_chance = 0.50
concession_ratio = 0.15
max_concessions = 3
base_patience_loss_chance = 0.45

# 推拉策略：强硬
[negotiation.push_pull.HARD]
base_concession_chance = 0.15
concession_ratio = 0.10
max_concessions = 1
base_patience_loss_chance = 0.75

# 推拉策略：狡猾
[negotiation.push_pull.SLY]
base_concession_chance = 0.30
concession_ratio = 0.10
max_concessions = 2
base_patience_loss_chance = 0.65

# 推拉策略：沉稳
[negotiation.push_pull.CALM]
base_concession_chance = 0.25
concession_ratio = 0.10
