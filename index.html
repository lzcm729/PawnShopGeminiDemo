<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231c1917'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23d97706' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='%23d97706' font-size='14' font-weight='bold'%3E%C2%A5%3C/text%3E%3C/svg%3E">
    <title>The Pawn's Dilemma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style id="design-tokens">
      :root {
        /* Phase 1: Design Tokens - Colors */
        --surface-primary: #0a0a0a;
        --surface-elevated: #1c1917;
        --surface-overlay: rgba(0, 0, 0, 0.85);
        
        --text-primary: #e5e5e5;
        --text-secondary: #a8a29e;
        --text-muted: #57534e;
        --text-inverse: #0a0a0a;

        --accent-primary: #d97706; /* Amber 600 - The "Gold" */
        --accent-glow: rgba(217, 119, 6, 0.3);
        
        /* Reputation Axes */
        --rep-humanity: #e11d48; /* Rose 600 */
        --rep-credibility: #f59e0b; /* Amber 500 */
        --rep-innocence: #3b82f6; /* Blue 500 */

        /* Status */
        --status-success: #10b981;
        --status-warning: #f59e0b;
        --status-danger: #ef4444;

        /* Phase 1: Design Tokens - Spacing/Radius */
        --radius-sm: 2px;
        --radius-md: 4px;
        --radius-lg: 8px;
        --radius-xl: 12px;

        /* Phase 1: Motion Tokens */
        --transition-fast: 150ms ease-out;
        --transition-normal: 200ms ease-out;
        --transition-slow: 300ms ease-out;
      }

      body {
        background-color: var(--surface-primary);
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
      }

      /* Custom Scrollbar - Task 1.1 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(217, 119, 6, 0.3); 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(217, 119, 6, 0.5); 
      }

      /* Input Focus - Task 1.3 */
      input:focus, textarea:focus, select:focus {
        border-color: rgba(217, 119, 6, 0.5);
        box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15);
        outline: none;
      }

      /* Neo-Noir Range Slider */
      input[type=range] {
        -webkit-appearance: none;
        background: transparent;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        background: var(--accent-primary);
        border: 2px solid #fff;
        border-radius: 50%;
        cursor: url('/cursors/hand_closed.png') 16 16, grab;
        margin-top: -6px;
        box-shadow: 0 0 10px var(--accent-glow);
        transition: transform 0.1s;
      }
      input[type=range]:hover::-webkit-slider-thumb {
        transform: scale(1.2);
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: url('/cursors/hand_point.png') 10 2, pointer;
        background: #44403c;
        border-radius: 2px;
      }

      /* Custom Game Cursors (Kenney Cursor Pack - Outline/Default) */
      /*
       * Uses !important to override Tailwind utility classes (cursor-pointer,
       * cursor-not-allowed) so the custom cursor theme is applied consistently.
       * Fallback values ensure usability if PNG fails to load.
       */

      /* Global default cursor */
      *, *::before, *::after {
        cursor: url('/cursors/pointer_a.png') 4 2, default !important;
      }

      /* Clickable elements - pointing hand */
      a, button:not(:disabled), [role="button"], label[for], select, summary,
      input[type="button"], input[type="submit"], input[type="reset"],
      input[type="checkbox"], input[type="radio"],
      .cursor-pointer, .cursor-game-pointer {
        cursor: url('/cursors/hand_point.png') 10 2, pointer !important;
      }

      /* Disabled elements override */
      button:disabled, [aria-disabled="true"],
      .cursor-not-allowed, .cursor-game-disabled {
        cursor: url('/cursors/cursor_disabled.png') 4 2, not-allowed !important;
      }

      /* Range slider thumb - grabbing hand */
      input[type=range]::-webkit-slider-thumb {
        cursor: url('/cursors/hand_closed.png') 16 16, grab !important;
      }

      /* Help cursor */
      .cursor-help, .cursor-game-help {
        cursor: url('/cursors/cursor_help.png') 4 2, help !important;
      }

      /* Zoom / Appraisal cursor */
      .cursor-game-zoom {
        cursor: url('/cursors/zoom_in.png') 12 12, zoom-in !important;
      }

      /* Look / Inspect cursor */
      .cursor-game-look {
        cursor: url('/cursors/look_a.png') 16 16, default !important;
      }

      /* Grab cursor (open hand for draggable) */
      .cursor-game-grab {
        cursor: url('/cursors/hand_open.png') 16 16, grab !important;
      }

      /* Grabbing cursor (closed hand while dragging) */
      .cursor-game-grabbing {
        cursor: url('/cursors/hand_closed.png') 16 16, grabbing !important;
      }

      /* Loading / busy cursor */
      .cursor-game-busy {
        cursor: url('/cursors/busy_hourglass.png') 16 16, wait !important;
      }

      /* Night phase sci-fi cursor */
      .cursor-game-night {
        cursor: url('/cursors/pointer_scifi_a.png') 4 2, default !important;
      }
      .cursor-game-night a,
      .cursor-game-night button:not(:disabled),
      .cursor-game-night [role="button"],
      .cursor-game-night .cursor-pointer {
        cursor: url('/cursors/hand_point.png') 10 2, pointer !important;
      }
      .cursor-game-night button:disabled,
      .cursor-game-night .cursor-not-allowed {
        cursor: url('/cursors/cursor_disabled.png') 4 2, not-allowed !important;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              serif: ['"Playfair Display"', 'serif'],
              display: ['"Playfair Display"', 'serif'],
            },
            colors: {
              // Legacy support
              pawn: {
                dark: '#1a1a1a',
                panel: '#262626',
                accent: '#d97706',
                text: '#e5e5e5',
                green: '#10b981',
                red: '#ef4444',
                muted: '#737373'
              },
              // New Design System
              noir: {
                100: 'var(--surface-primary)',
                200: 'var(--surface-elevated)',
                300: '#292524', // Stone 800
                400: '#44403c', // Stone 700
                500: '#57534e', // Stone 600
                600: '#78716c', // Stone 500
                txt: {
                  primary: 'var(--text-primary)',
                  secondary: 'var(--text-secondary)',
                  muted: 'var(--text-muted)',
                  inverse: 'var(--text-inverse)',
                },
                accent: 'var(--accent-primary)',
                humanity: 'var(--rep-humanity)',
                credibility: 'var(--rep-credibility)',
                innocence: 'var(--rep-innocence)',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'range-glow': 'rangeGlow 0.8s ease-out forwards',
              'breakthrough-glow': 'breakthroughGlow 2s ease-out forwards',
              'value-jump-flash': 'valueJumpFlash 0.8s ease-out forwards',
              'trait-reveal': 'traitReveal 0.6s ease-out forwards',
            },
            keyframes: {
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              },
              fadeInUp: {
                '0%': { opacity: 0, transform: 'translateY(10px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' }
              },
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 }
              },
              fadeOut: {
                '0%': { opacity: 1 },
                '100%': { opacity: 0 }
              },
              shutterDown: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(0)' }
              },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' }
              },
              rangeGlow: {
                '0%': { boxShadow: '0 0 0 0 rgba(16, 185, 129, 0)' },
                '30%': { boxShadow: '0 0 12px 2px rgba(16, 185, 129, 0.6)' },
                '100%': { boxShadow: '0 0 0 0 rgba(16, 185, 129, 0)' }
              },
              breakthroughGlow: {
                '0%': { boxShadow: '0 0 0 0 rgba(217, 119, 6, 0)', opacity: 0, transform: 'translateY(4px) scale(0.95)' },
                '20%': { boxShadow: '0 0 20px 4px rgba(217, 119, 6, 0.5)', opacity: 1, transform: 'translateY(0) scale(1)' },
                '80%': { boxShadow: '0 0 10px 2px rgba(217, 119, 6, 0.3)', opacity: 1, transform: 'translateY(0) scale(1)' },
                '100%': { boxShadow: '0 0 0 0 rgba(217, 119, 6, 0)', opacity: 0, transform: 'translateY(-4px) scale(0.95)' }
              },
              valueJumpFlash: {
                '0%': { opacity: 0 },
                '15%': { opacity: 0.7 },
                '30%': { opacity: 0.2 },
                '45%': { opacity: 0.6 },
                '60%': { opacity: 0.1 },
                '75%': { opacity: 0.4 },
                '100%': { opacity: 0 }
              },
              traitReveal: {
                '0%': { opacity: 0, transform: 'translateX(-8px) scale(0.9)', boxShadow: '0 0 0 0 rgba(217, 119, 6, 0)' },
                '40%': { opacity: 1, transform: 'translateX(2px) scale(1.02)', boxShadow: '0 0 15px 2px rgba(217, 119, 6, 0.3)' },
                '100%': { opacity: 1, transform: 'translateX(0) scale(1)', boxShadow: '0 0 0 0 rgba(217, 119, 6, 0)' }
              }
            }
          }
        }
      }
    </script>

{
  "imports": {

  }
}
</script>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
